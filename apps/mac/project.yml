name: Shipreel
options:
  bundleIdPrefix: com.reidcoleman
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: JU6MZ954WS
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Shipreel:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: ../shared
        excludes:
          - Fonts/OFL.txt
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Shipreel
        CFBundleName: Shipreel
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Shipreel. Instrument Serif is licensed under the SIL Open Font License 1.1."
        NSAppleEventsUsageDescription: "Shipreel opens Terminal in your Shipreel folder and starts Claude Code there."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reidcoleman.shipreel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
